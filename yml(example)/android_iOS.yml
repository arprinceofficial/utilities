name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Production Assets & Sync Android
        run: npm run build:android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB for Play Store) & APKs
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v6
        with:
          name: noor-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload Direct Installable Test APK
        uses: actions/upload-artifact@v6
        with:
          name: noor-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: noor-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

  build-ios:
    name: Build iOS (IPA & Archive)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Apply iOS Plugin Compatibility Patch
        run: node scripts/patch-app-plugin.cjs

      - name: Build Web Production Assets & Sync iOS
        run: npm run build:ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Archive (.xcarchive) for App Store
        run: |
          cd ios/App
          rm -rf build
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Noor.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .IPA & Zip .xcarchive
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r Noor.xcarchive/Products/Applications/App.app Payload/
          zip -r Noor.ipa Payload
          zip -r Noor.xcarchive.zip Noor.xcarchive

      - name: Upload iOS App Store Archive (.xcarchive)
        uses: actions/upload-artifact@v6
        with:
          name: noor-ios-xcarchive
          path: ios/App/build/Noor.xcarchive.zip
          if-no-files-found: warn

      - name: Upload iOS App Package (.ipa)
        uses: actions/upload-artifact@v6
        with:
          name: noor-ios-ipa
          path: ios/App/build/Noor.ipa
          if-no-files-found: warn
